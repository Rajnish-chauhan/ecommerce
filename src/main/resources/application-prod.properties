# Trust Cloudflare SSL and forwarded proxy headers
server.forward-headers-strategy=framework

# MongoDB Atlas connection
spring.data.mongodb.uri=${MONGO_ATLAS_PROD:${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/ecommerce}}

# Mail sender credentials and SMTP settings
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${EMAIL_USER_PROD:${SPRING_MAIL_USERNAME:test@example.com}}
spring.mail.password=${EMAIL_APP_PASS_PROD:${SPRING_MAIL_PASSWORD:password}}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Google OAuth2 credentials with fixed production HTTPS redirect URI
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID_PROD:dummy_client_id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET_PROD:dummy_client_secret}
spring.security.oauth2.client.registration.google.redirect-uri=${REDIRECT_URL_PROD:https://shop.rajnishsystems.in/login/oauth2/code/google}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# Razorpay production credentials
razorpay.key.id=${RAZORPAY_KEY_ID:${RAZORPAY_ID_PROD:rzp_test_dummy}}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:${RAZORPAY_SECRET_PROD:dummy_secret}}

# Production frontend domain on Vercel
api.external-service.url=${FRONTEND_URL_PROD:https://sastahai.rajnishsystems.in}