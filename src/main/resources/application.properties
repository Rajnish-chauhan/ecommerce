spring.application.name=Ecommerce
# Default profile
spring.profiles.active=${SPRING_PROFILES_ACTIVE:test}

# MongoDB connection with fallbacks
spring.data.mongodb.uri=${MONGO_ATLAS_PROD:${MONGO_LOCAL_TEST:mongodb://localhost:27017/ecommerce}}

# Standard Spring Mail SMTP Configuration (Required for JavaMailSender)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true