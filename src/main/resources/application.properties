spring.application.name=Ecommerce
# Default profile
spring.profiles.active=${SPRING_PROFILES_ACTIVE:test}

# MongoDB connection
spring.data.mongodb.uri=${MONGO_ATLAS_PROD:${SPRING_DATA_MONGODB_URI:${MONGO_LOCAL_TEST:mongodb://localhost:27017/ecommerce}}}

# Spring Mail SMTP settings
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Google OAuth2 (Required for ClientRegistrationRepository bean creation)
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID_PROD:${GOOGLE_CLIENT_ID_TEST:dummy-client-id}}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET_PROD:${GOOGLE_CLIENT_SECRET_TEST:dummy-client-secret}}
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/google
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# Razorpay credentials with fallbacks
razorpay.key.id=${RAZORPAY_KEY_ID:${RAZORPAY_ID_PROD:${RAZORPAY_ID_TEST:rzp_test_dummy}}}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:${RAZORPAY_SECRET_PROD:${RAZORPAY_SECRET_TEST:dummy_secret}}}

# Frontend origin URL
api.external-service.url=${FRONTEND_URL_PROD:${FRONTEND_URL_TEST:https://sastahai.rajnishsystems.in}}