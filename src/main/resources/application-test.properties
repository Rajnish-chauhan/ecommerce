# Local MongoDB connection
spring.data.mongodb.uri=${MONGO_LOCAL_TEST:mongodb://localhost:27017/ecommerce}

# Local mail sender credentials
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${EMAIL_USER_TEST:test@example.com}
spring.mail.password=${EMAIL_APP_PASS_TEST:password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Local Google OAuth2 credentials with dynamic baseUrl for localhost
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID_TEST:dummy_client_id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET_TEST:dummy_client_secret}
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/google
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# Local Razorpay credentials
razorpay.key.id=${RAZORPAY_KEY_ID:${RAZORPAY_ID_TEST:rzp_test_dummy}}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:${RAZORPAY_SECRET_TEST:dummy_secret}}

# Local frontend origin for CORS
api.external-service.url=http://localhost:5173